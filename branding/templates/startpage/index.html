<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$name</title>
<style>
  @font-face { font-family: Pixel; src: url("font.ttf"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0f14 url("wallpaper.png") center / cover no-repeat fixed;
    image-rendering: pixelated;
    color: #c9d1d9;
    font-family: Pixel, monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    background: rgba(11, 15, 20, 0.88);
    border: 4px solid #5cff7a;
    padding: 32px 40px 28px;
    width: min(860px, 94vw);
  }
  .top { display: flex; align-items: center; gap: 20px; }
  .top img { width: 96px; height: 96px; image-rendering: pixelated; }
  h1 { margin: 0; color: #5cff7a; font-size: 32px; font-weight: normal; letter-spacing: 2px; }
  #clock { color: #ffb000; font-size: 24px; margin-top: 8px; }
  form { display: flex; gap: 10px; margin: 26px 0 22px; }
  input {
    flex: 1; background: #0b0f14; color: #c9d1d9; border: 2px solid #3a4450;
    font: 16px Pixel, monospace; padding: 12px 14px; outline: none; text-transform: uppercase;
  }
  input:focus { border-color: #5cff7a; }
  button {
    background: #141a22; color: #5cff7a; border: 2px solid #3a4450;
    font: 16px Pixel, monospace; padding: 0 16px; cursor: pointer;
  }
  button:hover, button:focus { border-color: #5cff7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body { padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .tiles a {
    display: block; text-decoration: none; background: #141a22; border: 3px solid #3a4450;
    padding: 16px 14px; color: #5cff7a; font-size: 16px;
    min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .tiles a span { display: block; color: #8b97a3; margin-top: 8px; font-size: 14px;
                  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tiles a:hover, .tiles a:focus { border-color: #5cff7a; background: #14301c; }
  .tiles a.del { border-color: #ff5c5c; }
  .tiles a.del span { color: #ff5c5c; }
  .edit { text-align: right; margin-top: 14px; }
  .edit a { color: #8b97a3; text-decoration: none; }
  .edit a:hover { color: #5cff7a; }
  @media (max-width: 700px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
  <div class="panel">
    <div class="top">
      <img src="logo.png" alt="">
      <div>
        <h1>$name</h1>
        <div id="clock"></div>
      </div>
    </div>
    <form id="search">
      <input id="q" placeholder="Search the web" autofocus autocomplete="off">
      <button type="submit">SEARCH</button>
    </form>
    <div class="tiles" id="tiles"></div>
    <div class="edit"><a href="#" id="edit">EDIT SHORTCUTS</a></div>
  </div>
<script>
  // HUD clock
  function tick() {
    const d = new Date();
    document.getElementById("clock").textContent =
      d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "  " +
      d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
  }
  tick();
  setInterval(tick, 10000);

  // Web search
  document.getElementById("search").addEventListener("submit", e => {
    e.preventDefault();
    const q = encodeURIComponent(document.getElementById("q").value.trim());
    if (q) location.href = "https://www.google.com/search?q=" + q;
  });

  // Shortcuts, saved in this browser, editable
  const DEFAULTS = [
    ["GMAIL", "https://mail.google.com/"], ["DRIVE", "https://drive.google.com/"],
    ["MAPS", "https://maps.google.com/"], ["WEATHER", "https://weather.com/"],
    ["NEWS", "https://news.google.com/"], ["WIKIPEDIA", "https://en.wikipedia.org/"],
    ["YOUTUBE", "https://www.youtube.com/"]
  ];
  let editing = false;
  function load() {
    try { return JSON.parse(localStorage.getItem("shortcuts")) || DEFAULTS; } catch (e) { return DEFAULTS; }
  }
  function save(list) { try { localStorage.setItem("shortcuts", JSON.stringify(list)); } catch (e) {} }
  function draw() {
    const box = document.getElementById("tiles");
    box.innerHTML = "";
    const list = load();
    list.forEach(([name, url], i) => {
      const a = document.createElement("a");
      a.href = url;
      a.textContent = name;
      const sub = document.createElement("span");
      sub.textContent = editing ? "REMOVE" : new URL(url).hostname.replace(/^www\./, "");
      a.appendChild(sub);
      if (editing) a.classList.add("del");
      a.addEventListener("click", e => {
        if (!editing) return;
        e.preventDefault();
        list.splice(i, 1);
        save(list);
        draw();
      });
      box.appendChild(a);
    });
    const add = document.createElement("a");
    add.href = "#";
    add.textContent = "+ ADD";
    const s2 = document.createElement("span");
    s2.textContent = "Any site";
    add.appendChild(s2);
    add.addEventListener("click", e => {
      e.preventDefault();
      let url = (prompt("Website address") || "").trim();
      if (!url) return;
      if (!/^[a-z]+:\/\//i.test(url)) url = "https://" + url;
      const name = (prompt("Name for the shortcut", new URL(url).hostname.replace(/^www\./, "")) || "").trim();
      if (!name) return;
      list.push([name.toUpperCase().slice(0, 14), url]);
      save(list);
      draw();
    });
    box.appendChild(add);
  }
  document.getElementById("edit").addEventListener("click", e => {
    e.preventDefault();
    editing = !editing;
    e.target.textContent = editing ? "DONE" : "EDIT SHORTCUTS";
    draw();
  });
  draw();
</script>
</body>
</html>
