title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! First try **FIX PROBLEMS** in Sidewinder Welcome. If it broke right after an update, **GO BACK** gets you working again while we fix it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us like you'd tell a friend.
      placeholder: When I plug in my controller, Steam doesn't see it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How do we make it happen?
      description: The steps, one per line.
      placeholder: |
        1. Turn on the laptop
        2. Open Steam
        3. Plug in the controller
  - type: dropdown
    id: when
    attributes:
      label: When did it start?
      options:
        - It's always been like this
        - Right after an update
        - After I changed a setting or installed something
        - Not sure
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Your computer
      description: Brand and model, if you know it. It's on a sticker under most laptops.
      placeholder: Acer Nitro 5, RTX 3050
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or photos
      description: Drag them in here. A phone photo of the screen is fine.
