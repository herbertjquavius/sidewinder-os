# Builds the install ISO from the published image and tests the full install in a Secure Boot VM
name: iso

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: iso
  cancel-in-progress: true

jobs:
  iso:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q just qemu-system-x86 qemu-utils ovmf xorriso cpio isomd5sum python3-pil

      - name: Get the published image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "ghcr.io/${GITHUB_REPOSITORY,,}:latest"

      - name: Build ISO and install test
        run: just iso-test

      # Screenshots on their own branch, easy to read without downloads
      - name: Share screenshots on the ci-iso branch
        if: always()
        continue-on-error: true
        run: |
          [ -d output/iso-screens ] || exit 0
          sudo chown -R "$(id -u)" output/iso-screens
          cd output/iso-screens
          git init -q -b ci-iso
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "ISO screens from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-iso

      - name: Checksum
        run: |
          sudo rm -f output/bootiso/test.iso
          sudo chown -R "$(id -u):$(id -g)" output/bootiso
          cd output/bootiso && sha256sum *.iso > SHA256SUMS

      - name: Save ISO
        uses: actions/upload-artifact@v4
        with:
          name: install-iso
          path: output/bootiso/
          compression-level: 0
          retention-days: 14
