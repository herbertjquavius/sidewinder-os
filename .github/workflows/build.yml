# Builds the system image, boots it in a VM, and publishes it only if it reaches the login screen
name: build

on:
  push:
    branches: [main]
    # ISO and test script changes don't change the image; iso.yml runs on its own for those
    paths-ignore: ['installer/**', 'tests/iso-test.py', '.github/workflows/iso.yml', 'NOTES.md', 'docs/**']
  pull_request:
  # The daily kernel layer build kicks this off when it finishes
  workflow_run:
    workflows: [kernel]
    types: [completed]
  workflow_dispatch:

# A newer push cancels an older build, so an old image never overwrites a newer one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q just qemu-system-x86 ovmf socat python3-pil

      - name: Image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
          echo "KERNEL_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-kernel:latest" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: just build

      - name: Make test disk
        run: just disk

      - name: Boot test
        run: just test

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-screens
          path: output/screens
          if-no-files-found: ignore

      # Screenshots and boot log on a side branch, easy to read without downloads
      - name: Share screenshots on the ci-screens branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          [ -d output/screens ] || exit 0
          sudo chown -R "$(id -u)" output/screens
          cd output/screens
          git init -q -b ci-screens
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "VM screens from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens

      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE"
          sudo podman push "$IMAGE" "${IMAGE%:latest}:$(date +%Y%m%d)"
