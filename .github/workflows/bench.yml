# Kernel benchmarks in a VM: stock Fedora kernel vs CachyOS kernel vs CachyOS with LAVD
name: bench

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af >/dev/null || true

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf

      - name: Test disks
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for pair in "stock=ghcr.io/ublue-os/kinoite-main:latest" "sidewinder=ghcr.io/${GITHUB_REPOSITORY,,}:latest"; do
            n=${pair%%=*}; base=${pair#*=}
            sudo podman build --pull=newer --build-arg BASE="$base" -t "localhost/bench-$n" tests/bench-image
            mkdir -p "output/$n"
            sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
              -v "./output/$n:/output" -v ./tests/vm-config.toml:/config.toml:ro \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              quay.io/centos-bootc/bootc-image-builder:latest --type qcow2 --rootfs btrfs "localhost/bench-$n"
            sudo podman rmi -f "localhost/bench-$n" "$base" || true
          done

      - name: Run benchmarks
        run: |
          mkdir -p results
          sudo tests/bench-vm.sh output/stock/qcow2/disk.qcow2 results/stock.log
          sudo tests/bench-vm.sh output/sidewinder/qcow2/disk.qcow2 results/cachyos.log no-scx
          sudo tests/bench-vm.sh output/sidewinder/qcow2/disk.qcow2 results/cachyos-lavd.log
          python3 tests/bench_table.py "Stock Fedora" results/stock.log "CachyOS kernel" results/cachyos.log \
            "CachyOS + LAVD" results/cachyos-lavd.log | tee results/results.md
          cat results/results.md >> "$GITHUB_STEP_SUMMARY"

      # Results on a side branch, easy to read without downloads
      - name: Share results on the ci-bench branch
        if: always()
        continue-on-error: true
        run: |
          [ -d results ] || exit 0
          sudo chown -R "$(id -u)" results
          cd results
          git init -q -b ci-bench
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Benchmarks from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-bench
