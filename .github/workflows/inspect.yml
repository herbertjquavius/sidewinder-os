# Runs one shell command inside the published image and prints the output, for checking what's in it
name: inspect

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: Command to run inside the image
        required: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Run
        env:
          CMD: ${{ inputs.cmd }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          podman run --rm "$IMAGE" bash -c "$CMD"
